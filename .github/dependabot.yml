version: 2
updates:
  # Minor and patch releases are grouped into one weekly PR per ecosystem;
  # each major release arrives as its own PR so breaking changes can be reviewed separately.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directories: [/tests, /.github]
    schedule:
      interval: monthly
    groups:
      tooling:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # The v2.6.0 image is broken upstream (ossf/scorecard-action#1752); later releases are still offered.
      - dependency-name: ossf/scorecard-action
        versions: ["2.6.0"]
