name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check backend tests
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc -b
        working-directory: frontend

  test:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      RATE_LIMIT_PER_MINUTE: "100000"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and start the stack
        run: docker compose -p pdfvana up -d --build --wait
      - name: Build test runner
        run: docker build --target test -t pdfvana-test .
      - name: Run tests
        run: docker run --rm --network pdfvana_default -e BASE_URL=http://app:8000 pdfvana-test -p no:cacheprovider
      - name: Logs on failure
        if: failure()
        run: docker compose -p pdfvana logs --tail=200
