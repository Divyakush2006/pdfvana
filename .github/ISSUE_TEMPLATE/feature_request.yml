name: Feature request
description: Suggest a new tool, format or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Mention input/output formats if relevant.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
