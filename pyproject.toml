[project]
name = "pdfvana"
version = "1.1.0"
description = "Free and open-source PDF tools and universal file converter"
license = "Apache-2.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501", "E731", "E741", "B008", "B023", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
