<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PDFVana — Free PDF Tools & Universal File Converter</title>
    <meta name="description" content="Merge, split, compress and convert PDF, Word, Excel, PowerPoint, images, audio and video. Free, private, no sign-up, no watermarks." />
    <!--seo-head-->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script src="/theme.js"></script>
    <style>
      /* First paint before the app loads (also what search engines read). */
      html{background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      html.dark{background:#020617;color:#e2e8f0}
      .ssr{max-width:880px;margin:0 auto;padding:96px 20px 40px;line-height:1.6}
      .ssr h1{font-size:2.2rem;line-height:1.15;margin:0 0 12px}
      .ssr h2{font-size:1.15rem;margin:28px 0 8px}.ssr h3{font-size:1rem;margin:16px 0 4px}
      .ssr a{color:#4f46e5}.ssr ul,.ssr ol{padding-left:20px}
      .ssr-loading{margin-top:32px;color:#64748b}
    </style>
  </head>
  <body>
    <div id="root"><!--seo-body--></div>
    <noscript><p style="text-align:center;padding:16px">PDFVana needs JavaScript to process files. Please enable it in your browser.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
